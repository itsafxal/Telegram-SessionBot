services:
  - type: web
    name: universal-session-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 10000
